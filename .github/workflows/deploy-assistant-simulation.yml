name: Deploy assistant simulation infrastructure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistant-simulation-terraform
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      TERRAFORM_DIR: infrastructure/terraform/environments/assistant-simulation
      RESEARCH_BUCKET: investoros-dev-010928221556-research-data-us-east-1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare Lambda package
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          rebuild=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            rebuild=true
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
            if grep -Eq '^(apps/api/|agent-skills/|infrastructure/terraform/|scripts/build-api\.sh$)' <<<"$changed_files"; then
              rebuild=true
            fi
          fi

          if [[ "$rebuild" == true ]]; then
            dataset_dir="docs/prep/sources/Datathon2026/alphaforge_starter"
            mkdir -p "$dataset_dir"
            for name in assets_universe.csv prices_daily.csv corporate_actions.csv; do
              aws s3 cp "s3://${RESEARCH_BUCKET}/alphaforge_starter/${name}" "$dataset_dir/${name}" --only-show-errors
            done
            ./scripts/build-api.sh
          else
            mkdir -p apps/api/build
            code_url="$(aws lambda get-function \
              --function-name investoros-dev-assistant-simulation \
              --query 'Code.Location' \
              --output text)"
            curl --fail --silent --show-error "$code_url" --output apps/api/build/investoros-api.zip
          fi

      - name: Initialize Terraform
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform init -input=false

      - name: Plan and apply safe changes
        working-directory: ${{ env.TERRAFORM_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          plan_log="$RUNNER_TEMP/terraform-plan.log"
          set +e
          terraform plan -no-color -input=false -detailed-exitcode -out=tfplan >"$plan_log" 2>&1
          plan_status=$?
          set -e

          if [[ "$plan_status" -eq 0 ]]; then
            echo "Terraform: aucun changement à appliquer."
            exit 0
          elif [[ "$plan_status" -ne 2 ]]; then
            echo "::error::terraform plan a échoué (code ${plan_status}); détails masqués pour éviter d'exposer des valeurs du state ou des URL AWS temporaires."
            exit "$plan_status"
          fi

          set +e
          terraform show -json tfplan | python -c '
          import json, sys
          plan = json.load(sys.stdin)
          changes = plan.get("resource_changes", [])
          blocked = []
          for item in changes:
              action = item.get("change", {}).get("actions", [])
              if "delete" not in action:
                  continue
              rotation = (
                  item.get("address") == "aws_s3_object.api_package"
                  and action == ["delete", "create"]
                  and item.get("change", {}).get("replace_paths", []) == [["key"]]
              )
              if rotation:
                  print("Rotation de l'archive Lambda adressée par contenu.")
              else:
                  blocked.append(item)
          if blocked:
              print("Application bloquée: le plan contient une suppression ou un remplacement:")
              for item in blocked:
                  action = item.get("change", {}).get("actions", [])
                  paths = item.get("change", {}).get("replace_paths", [])
                  print("- {}: {}; attributs déclencheurs: {}".format(item.get("address"), action, paths))
              sys.exit(1)
          planned = [
              (item["address"], item["change"]["actions"])
              for item in changes
              if item.get("change", {}).get("actions") != ["no-op"]
          ]
          print("Plan sans suppression ni remplacement; application autorisée.")
          for item in planned:
              print("- {}: {}".format(item[0], item[1]))
          '
          summary_status=$?
          set -e
          if [[ "$summary_status" -ne 0 ]]; then
            exit "$summary_status"
          fi

          apply_log="$RUNNER_TEMP/terraform-apply.log"
          set +e
          terraform apply -no-color -input=false -auto-approve tfplan >"$apply_log" 2>&1
          apply_status=$?
          set -e
          if [[ "$apply_status" -ne 0 ]]; then
            echo "::error::terraform apply a échoué (code ${apply_status}); détails masqués pour éviter d'exposer des valeurs du state ou des URL AWS temporaires."
            exit "$apply_status"
          fi
          echo "Application Terraform terminée avec succès."
